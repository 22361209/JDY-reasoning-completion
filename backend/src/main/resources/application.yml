spring:
  application:
    name: jdy-erp
  datasource:
    url: ${JDY_DB_URL:jdbc:postgresql://localhost:5432/jdy_erp}
    username: ${JDY_DB_USERNAME:jdy}
    password: ${JDY_DB_PASSWORD:jdy_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: redis
  data:
    redis:
      host: ${JDY_REDIS_HOST:localhost}
      port: ${JDY_REDIS_PORT:6379}

server:
  port: ${JDY_SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${JDY_SESSION_TIMEOUT:30m}
  error:
    include-message: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

jdy:
  dev:
    build-fingerprint: ${JDY_DEV_BUILD_FINGERPRINT:}
  security:
    dev-open-api: ${JDY_DEV_OPEN_API:true}
  inventory:
    test-adjustment-api:
      enabled: ${JDY_TEST_INVENTORY_ADJUSTMENT_API_ENABLED:false}
      allowed-account-set-codes: ${JDY_TEST_INVENTORY_ADJUSTMENT_ALLOWED_ACCOUNT_SETS:}
