name: Project gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # The Excel/docs exporter uses @oai/artifact-tool, which is not declared in a
      # repository lockfile. CI therefore cannot reproducibly regenerate docs/01-03;
      # this gate starts from the tracked approved scope + implementation overrides.
      - name: Regenerate effective and frontend scope artifacts
        run: node generate-frontend-scope.mjs

      - name: Reject stale generated scope artifacts
        shell: bash
        run: |
          git ls-files --error-unmatch \
            config/effective-feature-scope.json \
            frontend/src/app/featureScope.ts
          git diff --exit-code -- \
            config/effective-feature-scope.json \
            frontend/src/app/featureScope.ts

      - name: Validate effective scope
        run: node scripts/effective-scope-contract-check.mjs

      - name: Validate delivery status
        run: node scripts/feature-delivery-status-scan.mjs

      - name: Validate regression manifest
        run: node scripts/validate-regression-manifest.mjs

      - name: Prove full tier is checkout-reproducible
        run: node scripts/run-regression-tier.mjs full --list

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA"...HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jdy_erp
          POSTGRES_USER: jdy
          POSTGRES_PASSWORD: jdy_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jdy -d jdy_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run backend test gate
        env:
          JDY_DB_URL: jdbc:postgresql://localhost:5432/jdy_erp
          JDY_DB_USERNAME: jdy
          JDY_DB_PASSWORD: jdy_dev
          JDY_REDIS_HOST: localhost
          JDY_REDIS_PORT: 6379
        run: ./scripts/backend-test.sh
